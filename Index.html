
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do You Love Me? ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ffe1ec, #fff0f5);
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.card {
  width: 90%;
  max-width: 400px;
  text-align: center;
  background: white;
  padding: 30px 15px;
  border-radius: 25px;
  box-shadow: 0 10px 35px #e98ba655;
}

.cat {
  font-size: 100px;
  animation: bounce 1.5s infinite;
}

@keyframes bounce {
  50% { transform: translateY(-10px); }
}

h1 {
  color: #e84379;
  font-size: 25px;
}

p {
  color: #777;
}

.stage {
  position: relative;
  width: 100%;
  height: 180px;
  margin-top: 15px;
}

button {
  border: none;
  border-radius: 30px;
  padding: 13px 30px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.25s;
  touch-action: manipulation;
}

#yes {
  position: absolute;
  left: 12%;
  top: 55px;
  background: #ff4f91;
  color: white;
  z-index: 2;
}

#no {
  position: absolute;
  left: 58%;
  top: 55px;
  background: #ddd;
  color: #444;
  z-index: 3;
}

#message {
  display: none;
  color: #ff3981;
  font-size: 24px;
  font-weight: bold;
}

.heart {
  position: fixed;
  bottom: -30px;
  font-size: 25px;
  animation: float 4s linear forwards;
  pointer-events: none;
}

@keyframes float {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="cat" id="cat">🥺</div>

  <h1 id="question">Do you love me? ❤️</h1>
  <p id="sub">Please tell me the truth 🥹</p>

  <div class="stage" id="stage">

    <button id="yes" onclick="sayYes()">
      YES ❤️
    </button>

    <button id="no" onclick="sayNo()">
      NO 🙈
    </button>

  </div>

  <div id="message">
    YAYYYY! I KNOW YOU ARE MY FOREVER PAPA! ❤️🥰
  </div>

</div>

<script>

let noCount = 0;
let yesSize = 18;

const yes = document.getElementById("yes");
const no = document.getElementById("no");
const stage = document.getElementById("stage");

function sayNo() {

  noCount++;

  // Make YES button bigger
  yesSize += 7;
  yes.style.fontSize = yesSize + "px";
  yes.style.padding = (13 + noCount * 2) + "px " +
                       (30 + noCount * 3) + "px";

  // Move NO button randomly
  const maxX = stage.clientWidth - no.offsetWidth;
  const maxY = stage.clientHeight - no.offsetHeight;

  const x = Math.random() * Math.max(0, maxX);
  const y = Math.random() * Math.max(0, maxY);

  no.style.left = x + "px";
  no.style.top = y + "px";

  document.getElementById("sub").innerText =
    noCount > 3 ? "Are you sure? 🥺❤️" :
    "Try again! 🙈";

}

function sayYes() {

  document.getElementById("question").innerText =
    "I KNEW IT!! ❤️";

  document.getElementById("sub").style.display = "none";
  document.getElementById("stage").style.display = "none";
  document.getElementById("cat").innerText = "😍";

  document.getElementById("message").style.display = "block";

  // Heart celebration
  for (let i = 0; i < 50; i++) {
    setTimeout(createHeart, i * 100);
  }

}

function createHeart() {

  const heart = document.createElement("div");

  heart.className = "heart";
  heart.innerText = ["❤️", "💖", "💕", "💗", "💘"][
    Math.floor(Math.random() * 5)
  ];

  heart.style.left = Math.random() * 100 + "vw";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 4000);

}

</script>

</body>
</html>
